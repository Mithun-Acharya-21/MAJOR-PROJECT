# Dataset registry. It is a planning/governance record, not evidence that data
# have been acquired or approved for use.
datasets:
  daic_woz:
    purpose: multimodal_depression_finetuning_and_evaluation
    modalities: [transcript, participant_audio, facial_features, video_metadata]
    label: depression_screening_score_or_challenge_label
    alignment: participant_session_aligned
    access: academic_or_non_profit_application_required
    status: pending_access_approval
    source: https://dcapswoz.ict.usc.edu/
    restrictions:
      - Never redistribute source files.
      - Use only under the approved data-use agreement.
      - Split by participant before model selection.
  e_daic:
    purpose: multimodal_depression_finetuning_and_evaluation_candidate
    modalities: [transcript, participant_audio, facial_features, video_metadata]
    label: depression_and_ptsd_assessment_labels
    alignment: participant_session_aligned
    access: academic_or_non_profit_application_required
    status: pending_access_approval
    source: https://dcapswoz.ict.usc.edu/
  erisk:
    purpose: text_depression_baseline_or_pretraining_only
    modalities: [longitudinal_user_writing]
    label: self_disclosed_depression_or_control
    alignment: text_only
    access: participant_agreement_required
    status: pending_task_registration
    source: https://erisk.irlab.org/
  fer2013:
    purpose: facial_emotion_pretraining_only
    modalities: [face_image]
    label: facial_expression
    alignment: emotion_only
    access: verify_source_terms_before_download
    status: pending_license_review
    source: https://www.kaggle.com/c/challenges-in-representation-learning-facial-expression-recognition-challenge/data
  ravdess:
    purpose: speech_and_facial_emotion_pretraining_only
    modalities: [audio, video]
    label: acted_emotion
    alignment: audio_video_aligned_per_actor_clip
    access: cc_by_nc_sa_4_0
    status: available_after_license_review
    source: https://zenodo.org/records/1188976
  crema_d:
    purpose: audiovisual_emotion_pretraining_only
    modalities: [audio, video, transcript_sentence]
    label: acted_emotion
    alignment: audio_video_aligned_per_actor_clip
    access: repository_terms_and_registration_notice
    status: available_after_license_review
    source: https://github.com/CheyneyComputerScience/CREMA-D

compatibility_rules:
  depression_fusion_requires: participant_session_aligned
  emotion_pretraining_must_not_create_depression_labels: true
  forbid_cross_dataset_person_pairing: true
  require_participant_disjoint_splits: true
  final_test_set_must_remain_locked: true

