services:

  # ---- Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./training:/training         # ML modules importable inside container
      - ./models:/models:ro          # Read-only model checkpoints
    environment:
      - PYTHONPATH=/app:/training
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- Frontend (development) ----
  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules           # Anonymous volume so host node_modules aren't mounted
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: emotisense_net
